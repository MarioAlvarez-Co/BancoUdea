# SonarQube/SonarCloud configuration
sonar.projectKey=BancoUdea
sonar.organization=mario-alvarez
sonar.host.url=https://sonarcloud.io

# Source code location
sonar.sources=src/main/java
sonar.tests=src/test/java

# Exclusions
sonar.exclusions=**/model/**,**/dto/**,**/config/**,**/BancoUdeaApplication.java
sonar.test.exclusions=**/src/test/java/**/integration/**

# Java configuration
sonar.java.source=21
sonar.java.target=21

# Coverage configuration
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Build wrapper output
sonar.cfamily.build-wrapper-output=bw-output

# Encoding
sonar.sourceEncoding=UTF-8
